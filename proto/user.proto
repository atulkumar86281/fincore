syntax = "proto3";

package db;

import "google/protobuf/timestamp.proto";

option go_package = "github/atulkumar0001/Bank/pb";

message User {
  string username = 1;
  string full_name = 2;
  string email = 3;
  google.protobuf.Timestamp password_last_updated = 4;
  google.protobuf.Timestamp created_at = 5;
}

